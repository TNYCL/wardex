[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TNYCL/wardex"
homepage = "https://github.com/TNYCL/wardex"
keywords = ["claude-code", "codex", "agents", "orchestrator", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
wardex-core = { path = "crates/wardex-core", version = "0.0.1" }
wardex-drivers = { path = "crates/wardex-drivers", version = "0.0.1" }
wardex-server = { path = "crates/wardex-server", version = "0.0.1" }

anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4.6", features = ["derive", "env"] }
fs2 = "0.4"
hex = "0.4"
hmac = "0.13"
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.28", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
