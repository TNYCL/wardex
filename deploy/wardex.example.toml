# Example Wardex config. Copy to ~/.config/wardex/wardex.toml and adjust.
# Precedence: this file < environment (WARDEX_*) < CLI flags.
# Secrets are never written here; only the names of env vars that hold them.

[daemon]
# Local CLI API. No token needed; protected by file permissions.
socket = "$XDG_RUNTIME_DIR/wardex.sock"
# HTTP for /healthz and /mcp. Refuses to start without a token.
http_listen = "127.0.0.1:7878"
database = "$XDG_STATE_HOME/wardex/wardex.db"
# Secrets as KEY=VALUE lines (mode 600). Read at start and on
# `wardex daemon reload` / SIGHUP; values win over the process env.
env_file = "$XDG_CONFIG_HOME/wardex/env"

[auth]
# Env var holding the bearer token for HTTP/MCP. Always required.
token_env = "WARDEX_TOKEN"

[http]
# Host headers /mcp accepts besides localhost. Add your tunnel hostname, e.g.
# allowed_hosts = ["wardex.example.com"]. Env: WARDEX_ALLOWED_HOSTS (comma list).
allowed_hosts = []
# Unauthenticated requests per minute before HTTP answers 429. 0 = no limit.
auth_failures_per_minute = 30

[sessions]
# Resume orphaned sessions automatically when the daemon starts (those that
# were mid-turn or waiting for an answer).
auto_resume_orphaned = false
# With auto_resume_orphaned: also restart sessions that were idle. Off: they
# stay orphaned until `send` resumes them.
auto_resume_idle = false
# Directory (relative to the repo) for --worktree sessions.
worktree_dir = ".worktree"
# Close an idle agent process after this long (default 12 h, at most 30 days);
# `send` resumes it. 0 = never. Each idle process keeps its memory meanwhile.
idle_shutdown_secs = 43200
# Keep at most this many idle agent processes; above it the longest idle one
# is closed (`send` resumes it). 0 = no limit.
max_idle_live = 8
# While the system's MemAvailable is below this many MiB, close idle agent
# processes, longest idle first and one at a time. Running turns and open
# questions are never closed. 0 = off.
min_mem_available_mb = 1024
# Seconds between closing stdin and killing a stopping session.
stop_grace_secs = 5

[timeouts]
question_reminder_secs = 180
question_stuck_secs = 480
# Silence while no tool is running before a session counts as stuck. 0 = off.
idle_stuck_secs = 480
# CPU usage (% of one core) of a session's processes that counts as activity.
busy_cpu_percent = 5.0

[retention]
events_days = 30
max_db_mb = 2048

[drivers.claude]
bin = "claude"
# default_model = "..."

[drivers.codex]
bin = "codex"
# default_model = "..."
# default_reasoning = "medium"
# Let Codex ask questions (item/tool/requestUserInput). Relies on the
# under-development Codex feature `default_mode_request_user_input`.
request_user_input = false

[drivers.grok]
bin = "grok"
# default_model = "..."
# default_reasoning = "high"
# Tool permission prompts: "inherit" (the user's Grok settings decide),
# "ask" (always-approve off for Wardex sessions) or "always_approve"
# (--always-approve). Wardex never answers a prompt on its own.
approval = "inherit"

[drivers.agy]
bin = "agy"
# default_model = "..."
# default_reasoning = "high"   # passed as --effort
# Actions that need review: "inherit" (the user's Antigravity settings;
# headless agy denies what it would ask about, and Wardex reports that turn
# as an error) or "always_approve" (--dangerously-skip-permissions).
approval = "inherit"
# extra_args = ["--sandbox"]

[resources]
systemd_scope = true
# Slices that `wardex run --slice <name>` may use.
slices = ["build.slice", "tests.slice"]

# Sessions started outside Wardex (docs/external-sessions.md): list them,
# read their history and adopt or fork them. Wardex only reads the CLIs'
# stores. Both switches are off by default.
[external]
enabled = false
# Also over MCP (HTTP and `wardex mcp --stdio`); every MCP client then sees
# your terminal sessions' history. Needs enabled.
mcp = false
# claude_home = "~/.claude"   # default: $CLAUDE_CONFIG_DIR, else ~/.claude
# codex_home = "~/.codex"     # default: $CODEX_HOME, else ~/.codex
quiet_secs = 120
# Only sessions whose cwd matches one of these globs are visible (empty: all).
cwd_allow = []
max_file_mb = 128
redact = true

# Webhooks. Repeat the table for multiple targets; see docs/webhooks.md.
# URLs, secrets and header values are env var names (set in env_file).
# After changes: wardex daemon reload (no restart needed).
[[webhooks]]
# Name used in logs instead of the URL.
name = "bot-a"
url_env = "WARDEX_WEBHOOK_URL"
events = ["question", "approval", "reminder", "done", "error", "stuck"]
# Optional: only sessions whose --agent / --task match these globs.
agents = ["bot-a"]
# tasks = ["fix-*"]
# Optional: event types sent for every session regardless of the filters.
# escalate = ["error", "stuck"]
# Optional: env var with an HMAC-SHA256 secret; sent as X-Wardex-Signature.
hmac_secret_env = "WARDEX_WEBHOOK_SECRET"
# Optional extra headers; values are env var names.
# headers = { "Authorization" = "WARDEX_WEBHOOK_AUTH" }

# Optional native MCP Events; independent of [[webhooks]]. See docs/mcp-events.md.
# Before enabling, protect the database (0600), its directory (0700) and backups.
# Existing permissions are checked, never silently changed. Subscription secrets
# are sensitive plaintext in SQLite. No platform subscription is created here.
[mcp_events]
enabled = false
authorization_epoch = 0     # bump on credential/access revocation; restart required
ttl_secs = 3600            # finite grant, 60..86400; minimum requested TTL is 60 s
max_subscriptions = 128     # 1..1024 per daemon owner
max_pending = 4096          # 1..65536 per subscription; overflow suspends it
retention_days = 7          # 1..365; replay is bounded by retained history
max_attempts = 8            # 1..32
retry_window_secs = 900     # 60..86400
timeout_secs = 10           # 1..30; includes DNS, connection and bounded response
